<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Stillwrite</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell" id="shell" data-mode="split">
      <header class="toolbar">
        <div class="toolbar-left">
          <button
            class="icon-btn"
            id="toggleSidebar"
            title="显示/隐藏文件栏 (Ctrl+B)"
          >
            ☰
          </button>
          <div class="file-menu" id="fileMenuRoot">
            <button
              class="text-btn file-menu-trigger"
              id="fileMenuButton"
              aria-haspopup="menu"
              aria-expanded="false"
              title="文件操作"
            >
              文件 <span aria-hidden="true">⌄</span>
            </button>
            <div class="file-menu-popover" id="fileMenu" role="menu" hidden>
              <button id="openFolder" role="menuitem">
                <span>打开文件夹…</span><kbd>Ctrl+O</kbd>
              </button>
              <button id="openDocument" role="menuitem">
                <span>打开 Markdown…</span><kbd>Ctrl+Shift+O</kbd>
              </button>
              <div class="menu-divider" role="separator"></div>
              <button id="newFile" role="menuitem">
                <span>新建 Markdown</span><kbd>Ctrl+N</kbd>
              </button>
              <button id="saveDocument" role="menuitem">
                <span>保存</span><kbd>Ctrl+S</kbd>
              </button>
              <button id="refreshMenu" role="menuitem">
                <span>刷新目录</span><kbd>Ctrl+R</kbd>
              </button>
              <div class="menu-divider" role="separator"></div>
              <button id="aggregateMenu" role="menuitem">
                <span>汇总批注 → 批注汇总.md</span>
              </button>
            </div>
          </div>
          <button
            class="text-btn"
            id="syncButton"
            title="git 同步到远端，首次手动同步后自动保存会跟随同步"
          >
            ⟳ 同步
          </button>
          <div class="workspace-name" id="workspaceName">未打开文件夹</div>
        </div>
        <div class="toolbar-center" id="documentTitle">Stillwrite</div>
        <div class="toolbar-right">
          <span class="sync-state" id="syncState" hidden></span>
          <span class="save-state" id="saveState">就绪</span>
          <button
            class="text-btn ask-agent-btn"
            id="askAgentButton"
            title="围绕当前文档或选区询问 Agent"
          >
            问 Agent
          </button>
          <button
            class="text-btn annotate-btn"
            id="annotationButton"
            title="为选中的字句添加批注 (Ctrl+Shift+M)"
          >
            ＋ 批注
          </button>
          <button
            class="text-btn related-btn"
            id="relatedButton"
            title="查看当前作品的关联材料"
            hidden
          >
            关联 <span id="relatedToolbarCount">0</span>
          </button>
          <div class="segmented" aria-label="视图模式">
            <button data-view="editor" title="仅写作 (Ctrl+1)">写</button>
            <button class="active" data-view="split" title="双栏 (Ctrl+2)">
              双
            </button>
            <button data-view="reader" title="仅阅读 (Ctrl+3)">读</button>
          </div>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-head">
            <div class="sidebar-tabs" role="tablist" aria-label="内容平面">
              <button class="sidebar-tab active" id="workspaceTab" role="tab" aria-selected="true">
                文件
              </button>
              <button class="sidebar-tab" id="libraryTab" role="tab" aria-selected="false">
                资料
              </button>
              <button class="sidebar-tab" id="agentTab" role="tab" aria-selected="false">
                Agent
              </button>
            </div>
            <div class="sidebar-head-actions">
              <button class="icon-btn subtle" id="addLibrarySource" title="添加资料源" hidden>
                ＋
              </button>
              <button class="icon-btn subtle" id="newAgentWorkButton" title="新建 Agent 工作" hidden>
                ＋
              </button>
              <button class="icon-btn subtle" id="refreshTree" title="刷新目录">
                ↻
              </button>
            </div>
          </div>
          <div class="search-box">
            <input
              id="searchInput"
              type="search"
              placeholder="搜索全文（FTS）…"
              autocomplete="off"
            />
          </div>
          <div class="library-meta" id="libraryMeta" hidden>
            <div id="libraryStats">尚未添加资料源</div>
          </div>
          <div class="workset-bar" id="worksetBar" hidden>
            <span id="worksetCount">当前引用 · 0 篇</span>
            <button class="text-btn" id="clearWorkset" type="button">清空</button>
          </div>
          <div class="agent-meta" id="agentMeta" hidden>
            <div id="agentStats">还没有 Agent 工作</div>
          </div>
          <div class="tree" id="tree">
            <div class="empty-tip">从“文件”菜单打开文件夹或 Markdown 文档</div>
          </div>
        </aside>
        <div
          class="resize-handle sidebar-handle"
          id="sidebarHandle"
          title="拖动调整文件栏"
        ></div>

        <section class="panes" id="panes">
          <section class="pane editor-pane" id="editorPane">
            <div class="pane-label" id="editorPaneLabel">WRITE</div>
            <textarea
              id="editor"
              spellcheck="true"
              autocomplete="off"
              aria-label="Markdown 写作区"
              placeholder="开始写作…"
            ></textarea>
          </section>
          <div
            class="resize-handle pane-handle"
            id="paneHandle"
            title="拖动调整写作/阅读比例"
          ></div>
          <section class="pane reader-pane" id="readerPane">
            <div class="pane-label">READ</div>
            <article class="markdown-body" id="preview">
              <div class="welcome">
                <h1>Stillwrite</h1>
                <p>从“文件”菜单打开文件夹或 Markdown 文档开始写作。</p>
                <p>
                  <kbd>Ctrl+1</kbd> 写作 · <kbd>Ctrl+2</kbd> 双栏 ·
                  <kbd>Ctrl+3</kbd> 阅读
                </p>
              </div>
            </article>
          </section>
        </section>
        <div
          class="resize-handle annotate-handle"
          id="annotateHandle"
          title="拖动调整支持栏"
        ></div>
        <section class="annotate-panel" id="annotatePanel" hidden>
          <div class="annotate-head">
            <div class="annotate-title support-view-tabs" role="tablist" aria-label="支持视图">
              <button
                class="support-view-tab active"
                id="annotationViewButton"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="annotateStream"
              >
                批注 <span class="annotate-count" id="annotateCount">0</span>
              </button>
              <button
                class="support-view-tab"
                id="relatedViewButton"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="relatedStream"
              >
                关联 <span class="annotate-count" id="relatedCount">0</span>
              </button>
            </div>
            <div class="annotate-actions">
              <button
                class="text-btn"
                id="newAnnotation"
                title="批注当前选中的字句；未选择时批注光标所在段落"
              >
                新批注
              </button>
              <button
                class="icon-btn subtle"
                id="closeAnnotate"
                title="关闭批注栏"
              >
                ✕
              </button>
            </div>
          </div>
          <div class="annotate-doc">
            <div class="annotate-doc-name" id="annotateDocName">未打开文档</div>
            <div class="annotate-doc-path" id="annotateDocPath"></div>
          </div>
          <div class="annotate-stream" id="annotateStream">
            <div class="annotate-stream-meta">
              <span id="annotateHint">选择字句或把光标放在段落中，再点“新批注”</span>
              <span class="annotate-save-state" id="annotateSaveState"></span>
            </div>
            <div class="annotate-composer" id="annotateComposer" hidden>
              <div class="annotation-quote" id="annotationDraftQuote"></div>
              <textarea
                id="annotationDraft"
                rows="4"
                spellcheck="true"
                autocomplete="off"
                placeholder="写下你的批注…"
              ></textarea>
              <div class="annotation-compose-actions">
                <button class="text-btn" id="cancelAnnotation" type="button">取消</button>
                <button class="primary-btn" id="addAnnotation" type="button">添加批注</button>
              </div>
            </div>
            <div class="annotation-empty" id="annotationEmpty">
              <span class="annotation-empty-mark">“</span>
              <strong>还没有批注</strong>
              <span>可按字句，也可按整段留下想法。</span>
            </div>
            <div class="annotation-list" id="annotationList" role="list"></div>
          </div>
          <div class="related-stream" id="relatedStream" hidden></div>
          <div class="annotate-foot" id="annotateFooter">
            <span id="annotateFoot">批注保存在「批注/」，随文档同步。</span>
            <button class="annotate-foot-action" id="aggregateButton" type="button">
              汇总全部
            </button>
          </div>
        </section>
      </main>
    </div>

    <dialog id="newFileDialog" class="modal">
      <form method="dialog" id="newFileForm">
        <h3>新建 Markdown</h3>
        <label for="newFileName">文件名</label>
        <input id="newFileName" value="untitled.md" autocomplete="off" />
        <p class="modal-help">可包含子目录，例如 <code>notes/idea.md</code></p>
        <div class="modal-actions">
          <button type="button" class="text-btn" id="cancelNewFile">取消</button>
          <button type="submit" class="primary-btn" id="createFileButton">
            创建
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="agentAskDialog" class="modal agent-ask-dialog">
      <form method="dialog" id="agentAskForm">
        <h3 id="agentAskTitle">问 Agent</h3>
        <div class="agent-ask-context" id="agentAskContext" hidden>
          <div class="agent-ask-context-label">当前选区</div>
          <blockquote id="agentAskQuote"></blockquote>
        </div>
        <div class="agent-ask-refs" id="agentAskRefs" hidden>
          <div class="agent-ask-context-label">当前引用</div>
          <ul id="agentAskRefList"></ul>
        </div>
        <textarea
          id="agentAskPrompt"
          rows="5"
          spellcheck="true"
          autocomplete="off"
          placeholder="例如：查证这个判断，并找两个反例…"
          aria-label="Agent 请求"
        ></textarea>
        <div class="modal-actions">
          <button type="button" class="text-btn" id="agentAskCancel">取消</button>
          <button type="submit" class="primary-btn" id="agentAskSend">发送</button>
        </div>
      </form>
    </dialog>

    <div class="selection-actions" id="selectionActions" hidden>
      <button class="selection-annotate" id="selectionAnnotate" type="button">
        ＋ 批注
      </button>
      <button class="selection-agent" id="selectionAgent" type="button">
        问 Agent
      </button>
      <button
        class="selection-related"
        id="selectionRelated"
        type="button"
        title="把当前选区加入关联检索"
      >
        ＋ 关联
      </button>
    </div>

    <script src="./annotations.js"></script>
    <script src="./document-links.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
