[package]
name = "stillwrite"
version = "0.1.0"
description = "A local-first immersive Markdown writing tool"
authors = ["Stillwrite"]
edition = "2021"

[lib]
name = "stillwrite_lib"
# Stillwrite currently ships as a desktop app.  The static/cdylib outputs are
# only needed by Tauri's mobile targets and make each debug build emit hundreds
# of megabytes of duplicate library artifacts.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rusqlite = { version = "0.40.1", features = ["bundled"] }
libc = "0.2"

# RSS / Atom source adapter (feeds.rs)：http 抓取、feed 解析、HTML→Markdown、OPML。
feed-rs = "2.4"
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
html2md = "0.2.17"
roxmltree = "0.20"
url = "2"
chrono = "0.4"

# Keep local builds compact. Full debug info and Cargo's incremental cache were
# responsible for most of the multi-gigabyte target directory.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# The distributed binary does not need symbols. Thin LTO gives most of the size
# benefit without the very slow link of full LTO. html2md 0.2.17 requires the
# unwind panic runtime when linked by Rust 1.98.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = true
